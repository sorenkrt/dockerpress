version: "3.8"
services:
  dbex:
    # Use the official MySQL 8.0 image (8.4 tag does not exist on Docker Hub)
    image: mysql:8.0
    container_name: ${container_name_mysql}
    restart: unless-stopped
    env_file: .env
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - db_data2:/var/lib/mysql
    ports:
    - "${MYSQL_PORT}:3306"
    healthcheck:
      # Use env substitution for the root password in the healthcheck
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 50s

  wordpress:
    build:
      context: .
      dockerfile: php-8.3/Dockerfile
    image: dockerpresswp:latest
    container_name: ${container_name_wordpress}
    restart: unless-stopped
    env_file: .env
    volumes:
      - wordpress_data:/var/www/html
    depends_on:
      dbex:
        condition: service_healthy
  
  redis:
    image: redis:7-alpine
    container_name: ${container_name_redis}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  wordpress_data:
  db_data2:
