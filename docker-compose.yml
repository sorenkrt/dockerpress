services:
  db1:
    image: mysql:8.4
    container_name: dockerpress_mysql
    restart: unless-stopped
    env_file: .env
    volumes:
      - db_data2:/var/lib/mysql
    ports:
    - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "db1", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  wordpress:
    build:
      context: .
      dockerfile: php-8.3/Dockerfile
    image: dockerpresswp:latest
    container_name: dockerpress_wordpress
    restart: unless-stopped
    env_file: .env
    volumes:
      - wordpress_data2:/var/www/html
    depends_on:
      db1:
        condition: service_healthy
  
  redis:
    image: redis:7-alpine
    container_name: dockerpress_redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  wordpress_data2:
  db_data2:
